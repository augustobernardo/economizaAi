version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'docker'
    # Scanner images live outside .github/: Dependabot cannot open PRs that change files there.
    directories: ['/', '/tools/ci/*']
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
