name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test
          POSTGRES_DB: economizaai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://postgres:postgres_test@localhost:5432/economizaai_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confere versão e CHANGELOG do PR de release
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          ver=$(node -p "require('./package.json').version")
          if [[ ! "${ver}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version is not MAJOR.MINOR.PATCH"; exit 1
          fi
          # --exit-code: 0 = tag found, 2 = not found, anything else = network/auth error (fail closed).
          rc=0
          git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}" "refs/tags/v${ver}" >/dev/null || rc=$?
          case "${rc}" in
            0) echo "::error::tag v${ver} already exists: bump version in package.json"; exit 1 ;;
            2) ;;
            *) echo "::error::could not query remote tags (git exit ${rc})"; exit 1 ;;
          esac
          if ! awk -v h="## [${ver}]" 'index($0, h) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${ver}]' section"; exit 1
          fi
          if ! awk '
            index($0, "## [Unreleased]") == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on && NF && !/^### / { left = 1 }
            END { exit left }
          ' CHANGELOG.md; then
            echo "::error::CHANGELOG.md [Unreleased] is not empty: move it to '## [${ver}]'"; exit 1
          fi

      - name: Instala pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instala Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Instala dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Testes unitários
        run: pnpm test

      - name: Testes de integração (Postgres)
        run: pnpm test:integration

      - name: Testes de integração (e2e)
        run: pnpm test:e2e

      - name: Audita dependências de produção
        run: pnpm audit --prod --audit-level high

      - name: Build da imagem Docker (sem publicar)
        run: docker build -t economizaai:ci .

      - name: Escaneia a imagem (trivy, CRITICAL com correção)
        run: |
          img=$(sed -n 's/^FROM //p' .github/tools/trivy/Dockerfile)
          docker save "economizaai:ci" -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP/image.tar:/in/image.tar:ro" "$img" \
            image --input /in/image.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          rm -f "$RUNNER_TEMP/image.tar"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Escaneia segredos no histórico
        run: |
          img=$(sed -n 's/^FROM //p' .github/tools/gitleaks/Dockerfile)
          docker run --rm -v "$PWD:/repo" "$img" \
            git --redact --verbose /repo

  release:
    name: release
    needs: [ci, gitleaks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.push.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ghcr.io/augustobernardo/economizaai
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build da imagem
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/augustobernardo/economizaAi \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:${GITHUB_SHA}" .

      - name: Escaneia a imagem (trivy, CRITICAL com correção e segredos)
        run: |
          img=$(sed -n 's/^FROM //p' .github/tools/trivy/Dockerfile)
          docker save "${IMAGE}:${GITHUB_SHA}" -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP/image.tar:/in/image.tar:ro" "$img" \
            image --input /in/image.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          # The image is public: any embedded secret fails the release, whatever its severity.
          docker run --rm -v "$RUNNER_TEMP/image.tar:/in/image.tar:ro" "$img" \
            image --input /in/image.tar --scanners secret --exit-code 1 --no-progress
          rm -f "$RUNNER_TEMP/image.tar"

      - name: Login no GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publica a imagem
        id: push
        run: |
          ver=$(node -p "require('./package.json').version")
          if [[ ! "${ver}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version is not MAJOR.MINOR.PATCH"; exit 1
          fi
          docker tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:main"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:main"
          tags="\`${GITHUB_SHA}\`, \`main\`"
          # :vX.Y.Z is written once; a merge without bump leaves the published one alone.
          if docker manifest inspect "${IMAGE}:v${ver}" >/dev/null 2>&1; then
            echo "::notice::image :v${ver} already published; not updated"
          else
            docker tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:v${ver}"
            docker push "${IMAGE}:v${ver}"
            tags="${tags}, \`v${ver}\`"
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")
          digest="${ref#*@}"
          case "${digest}" in
            sha256:*) ;;
            *) echo "::error::could not resolve pushed digest"; exit 1 ;;
          esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published \`${IMAGE}@${digest}\` (tags ${tags})" >> "$GITHUB_STEP_SUMMARY"

      - name: Atesta a proveniência
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Logout do GHCR
        if: always()
        run: docker logout ghcr.io

  tag:
    name: tag
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: tag-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cria a tag e a GitHub Release da versão
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
          DIGEST: ${{ needs.release.outputs.digest }}
          IMAGE: ghcr.io/augustobernardo/economizaai
        run: |
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version from release job is not MAJOR.MINOR.PATCH"; exit 1
          fi
          tag="v${VERSION}"
          # --exit-code: 0 = tag found, 2 = not found, anything else = network/auth error.
          rc=0
          git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}" "refs/tags/${tag}" >/dev/null || rc=$?
          case "${rc}" in
            0) echo "::notice::${tag} already exists; no release created (version not bumped)"; exit 0 ;;
            2) ;;
            *) echo "::error::could not query remote tags (git exit ${rc})"; exit 1 ;;
          esac
          # Releases are immutable: validate everything before publishing, never delete or recreate.
          case "${DIGEST}" in
            sha256:*) ;;
            *) echo "::error::missing image digest from release job"; exit 1 ;;
          esac
          notes="$RUNNER_TEMP/notes.md"
          awk -v h="## [${VERSION}]" '
            index($0, h) == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > "${notes}"
          if ! grep -q '[^[:space:]]' "${notes}"; then
            echo "::error::CHANGELOG.md has no notes for ${VERSION}"; exit 1
          fi
          {
            echo
            echo "### Container image"
            echo
            echo "- \`${IMAGE}:${tag}\`"
            echo "- \`${IMAGE}@${DIGEST}\`"
            echo
            echo "Build provenance is attested: \`gh attestation verify oci://${IMAGE}@${DIGEST} --owner augustobernardo\`"
          } >> "${notes}"
          gh release create "${tag}" --target "${GITHUB_SHA}" --title "${tag}" --notes-file "${notes}" --latest
          echo "Released \`${tag}\` at \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    steps:
      - name: Dispara o deploy no Easypanel
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # Easypanel pulls :main from GHCR; deploy only if main is still this commit, so :main is this run's image (ponytail: push between check and pull still races).
          head=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)
          if [ -z "${head}" ]; then
            echo "::error::could not resolve main head"
            exit 1
          fi
          if [ "${head}" != "${GITHUB_SHA}" ]; then
            echo "::notice::main moved to a newer commit; its own run will deploy it"
            exit 0
          fi
          # No -S and stderr dropped: curl errors would print the secret host in public logs.
          code=$(curl -s --max-time 30 -X POST \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            "${EASYPANEL_DEPLOY_URL}" -w '%{http_code}' -o /dev/null 2>/dev/null) || code="000"
          case "${code}" in
            2*) ;;
            *) echo "::error::deploy HTTP ${code}"; exit 1 ;;
          esac
