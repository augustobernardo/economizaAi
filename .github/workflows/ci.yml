name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test
          POSTGRES_DB: economizaai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://postgres:postgres_test@localhost:5432/economizaai_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instala pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instala Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Instala dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Testes unitários
        run: pnpm test

      - name: Testes de integração (Postgres)
        run: pnpm test:integration

      - name: Testes de integração (e2e)
        run: pnpm test:e2e

      - name: Audita dependências de produção
        run: pnpm audit --prod --audit-level high

      - name: Build da imagem Docker (sem publicar)
        run: docker build -t economizaai:ci .

      - name: Escaneia a imagem (trivy, CRITICAL com correção)
        run: |
          img=$(sed -n 's/^FROM //p' .github/tools/trivy/Dockerfile)
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$img" \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress economizaai:ci

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Escaneia segredos no histórico
        run: |
          img=$(sed -n 's/^FROM //p' .github/tools/gitleaks/Dockerfile)
          docker run --rm -v "$PWD:/repo" "$img" \
            git --redact --verbose /repo

  deploy:
    name: deploy
    needs: [ci, gitleaks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    steps:
      - name: Dispara o deploy no Easypanel
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # Easypanel builds the HEAD of main, so deploy only if it is the tested commit (ponytail: push between check and pull still races).
          head=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)
          if [ -z "${head}" ]; then
            echo "::error::could not resolve main head"
            exit 1
          fi
          if [ "${head}" != "${GITHUB_SHA}" ]; then
            echo "::notice::main moved to a newer commit; its own run will deploy it"
            exit 0
          fi
          # No -S and stderr dropped: curl errors would print the secret host in public logs.
          code=$(curl -s --max-time 30 -X POST \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            "${EASYPANEL_DEPLOY_URL}" -w '%{http_code}' -o /dev/null 2>/dev/null) || code="000"
          case "${code}" in
            2*) ;;
            *) echo "::error::deploy HTTP ${code}"; exit 1 ;;
          esac
